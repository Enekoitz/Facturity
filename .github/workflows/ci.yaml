name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
  ConnectionStrings__FacturityDbConnectionString: Host=localhost;Port=5432;Database=facturity;Username=postgres;Password=ci-password
  Jwt__SigningKey: clave-solo-para-tests-que-no-vale-para-nada-0123456789abcdef

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet Packages Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

#      - name: Verify code format
#        run: dotnet format --verify-no-changes --severity error

      - name: Compile
        run: dotnet build --no-restore --configuration Release

      - name: Execute Tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
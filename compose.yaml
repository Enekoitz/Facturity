name: Facturity

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: facturity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  seq:
    image: datalust/seq:latest
    container_name: seq_logs
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: 
    ports:
      - "5341:80"
  
  backend-api:
    build:
      context: .
      dockerfile: src/Host/Facturity.Api/Dockerfile
    container_name: dotnet_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FacturityDbConnectionString=Host=postgres-db;Database=facturity;Username=postgres;Password=${DB_PASSWORD}
      - Serilog__WriteTo__0__Args__configure__2__serverUrl=http://seq:80
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
    depends_on:
      - postgres-db
      - seq

volumes:
  postgres_data: